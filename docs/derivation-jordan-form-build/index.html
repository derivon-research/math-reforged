<h1>若当基给出若当型</h1>
<p>沿若当基中的每条链读取算子作用，得到一个若当块；把各链依次排列，矩阵就成为这些块的分块对角矩阵，即若当型。</p>
<blockquote>
<p>教材依据：第 8D 节，定义 8.42、8.44。权重 1.0：从基向量作用直接读取矩阵列；置信度高。</p>
</blockquote>
