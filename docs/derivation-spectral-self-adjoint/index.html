<h1>自伴算子的谱定理路线</h1>
<p>有限维实或复内积空间上的自伴算子具有实特征值；不同特征值的特征向量正交。对特征向量的正交补归纳，得到一组规范正交特征向量基。</p>
<p>这条路线与复正规算子的谱定理路线是 OR，不把“正规”和“自伴”错误地写成共同必需前提。</p>
<blockquote>
<p>教材依据：实谱定理 7.29 与复谱定理的自伴特例。权重 5.0：完整归纳证明是主要学习单元；置信度高。</p>
</blockquote>
