<h1>对角化</h1>
<p>算子可对角化，是指存在一组基，使它的矩阵为对角矩阵；等价地，空间存在一组由特征向量组成的基。</p>
<p>对角化强于上三角化。后者不保证有足够多线性无关的特征向量。</p>
