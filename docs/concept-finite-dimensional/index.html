<h1>有限维</h1>
<p>若向量空间能由某个有限向量组张成，就称它是有限维的。该性质只断言有限张成组存在，还没有给出任何数值。</p>
<p>维数要等到证明任意两组基等长后才能定义，因此是独立的后续节点。</p>
