<h1>幺正算子</h1>
<p>有限维内积空间上的算子 <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>T</mi></mrow><annotation encoding="application/x-tex">T</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.6833em;"></span><span class="mord mathnormal" style="margin-right:0.1389em;">T</span></span></span></span> 为幺正，是指它保持内积；等价地，$T^<em>T=TT^</em>=I$。</p>
<p>不同空间之间可以有等距映射而没有逆；“幺正”在这里专指同一空间上的可逆等距算子。</p>

<p>教材对应：第 7D 节，7.44-7.57。</p>
